name: Developer tooling
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/check-release.cjs
      - run: node scripts/pack-plugin.cjs
      - run: npm pack --ignore-scripts --pack-destination artifacts
      - run: npm run verify:package
      - name: Install the pinned OpenCode V2 verification host
        run: npm install --prefix "$RUNNER_TEMP/opencode-host" --no-audit --no-fund @opencode/cli@2.0.27
      - name: Verify native OpenCode commands, terminal UI, MCP and permissions
        run: MS_OPENCODE_BINARY="$RUNNER_TEMP/opencode-host/node_modules/.bin/opencode" MS_OPENCODE_TUI=1 npm run verify:package
