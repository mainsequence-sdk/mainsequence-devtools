name: Release developer tooling
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked npm artifact
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: devtools-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.6.2
      - run: npm ci --ignore-scripts
      - run: npm run release:check
      - uses: actions/upload-artifact@v4
        with:
          name: mainsequence-devtools-release
          path: artifacts/*.tgz
      - name: Publish the exact verified archive using npm trusted publishing
        if: github.ref_type == 'tag' || inputs.publish
        run: npm publish "./artifacts/dev-mainsequence-devtools-$(node -p 'require("./package.json").version').tgz" --ignore-scripts --access public --provenance
